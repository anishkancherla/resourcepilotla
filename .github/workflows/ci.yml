name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_only
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: resourcepilot_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_only -d resourcepilot_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      # Runs the store contract and end-to-end network tests against real Postgres too.
      TEST_DATABASE_URL: postgresql://ci_only:ci_only@localhost:5432/resourcepilot_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/bootstrap.py --force
      - run: uv run python scripts/verify_config.py
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy agents resourcepilot scripts
      - run: uv run pytest
      - run: docker compose config --quiet
      - run: docker build -t resourcepilot-la .
      - name: Ensure generated secrets are untracked
        run: |
          test -z "$(git status --short --untracked-files=all | awk '$2 == ".env" {print}')"
          git check-ignore .env .profiles.json
