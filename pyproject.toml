[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "resourcepilot-la"
version = "0.1.0"
description = "Multi-seller, hold-then-pay campus resource checkout on Fetch.ai uAgents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "asyncpg>=0.30.0,<1",
  "cosmpy>=0.9.2,<1",
  "httpx>=0.28.1,<1",
  "python-dotenv>=1.1.0,<2",
  "uagents>=0.25.2,<0.26",
]

[dependency-groups]
dev = [
  "mypy>=1.15.0,<2",
  "pytest>=8.3.5,<9",
  "pytest-asyncio>=0.26.0,<1",
  "ruff>=0.11.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["agents", "resourcepilot", "sellers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]
filterwarnings = [
  # Loading a runtime module includes protocols with publish_manifest=True outside a running
  # agent loop; the manifest coroutine is intentionally never scheduled in tests.
  "ignore:coroutine 'Agent.publish_manifest' was never awaited:RuntimeWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/"]
